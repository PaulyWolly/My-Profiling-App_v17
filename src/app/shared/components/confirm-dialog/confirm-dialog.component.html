<div class="confirm-dialog">
  <div *ngIf="data.title" class="confirm-dialog-header">
    <h2 class="confirm-dialog-title" [innerHTML]="data.title"></h2>
  </div>
  <div class="confirm-dialog-body">
    <p class="confirm-dialog-message">{{ data.message }}</p>
  </div>
  <div class="confirm-dialog-actions-bg">
    <div class="confirm-dialog-actions">
      <button mat-button type="button" (click)="onCancel()" class="confirm-dialog-cancel">
        {{ data.cancelText || 'Cancel' }}
      </button>
      <button mat-raised-button type="button" color="warn" (click)="onConfirm()" class="confirm-dialog-confirm">
        {{ data.confirmText || 'Delete' }}
      </button>
    </div>
  </div>
</div>
