# Render.com blueprint: deploy the Node/Express backend only.
# See docs/DEPLOY-RENDER-ALL.md for setup steps and environment variables.

services:
  - type: web
    name: my-profiling-app-api
    runtime: node

    # Left unset so it does not override the branch already configured on an
    # existing service. Work lands on dev, while the repo default is main.
    # branch: dev

    # Build and run from the server directory
    rootDir: server

    buildCommand: npm install
    startCommand: npm run start:prod

    # Render sets PORT automatically; the server uses process.env.PORT
    # Add all required env vars in the Render dashboard (see docs/DEPLOY-RENDER-ALL.md).
    # OPENAI_API_KEY and AZURE_SPEECH_KEY/AZURE_SPEECH_REGION are needed for the AI tools.
